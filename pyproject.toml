[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agintor"
version = "0.1.0"
description = "Agintor CLI MVP: bounded evolutionary runtime search for agent topology, memory, tooling, and control"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenAI"}]
dependencies = [
  "pydantic>=1.10,<2",
  "typer>=0.7,<1",
  "PyYAML>=6,<7",
  "numpy>=1.24,<3"
]

[project.optional-dependencies]
hosted = ["openai>=2,<3", "anthropic>=0.84.0"]
openai = ["openai>=2,<3"]
minimax = ["anthropic>=0.84.0"]
dev = ["pytest>=8", "pytest-cov>=4"]

[project.scripts]
agintor = "agintor.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agintor*"]

[tool.setuptools.package-data]
agintor = ["templates/baseline_runtime/*", "templates/prompts/*.json", "examples/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q -p no:cacheprovider --assert=plain -m \"not heavy and not docker and not live_openai\""
testpaths = ["tests"]
norecursedirs = ["_artifacts"]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
  "integration: runtime-backed integration coverage that should stay in the default offline suite",
  "heavy: runtime-heavy coverage kept out of the default fast suite",
  "docker: docker-backed coverage kept out of the default offline suite",
  "live_openai: live OpenAI integration tests (not run offline)",
]
