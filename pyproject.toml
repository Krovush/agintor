[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agintor"
version = "0.1.0"
description = "Agintor CLI MVP: bounded evolutionary runtime search for agent topology, memory, tooling, and control"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenAI"}]
dependencies = [
  "pydantic>=1.10,<2",
  "typer>=0.7,<1",
  "PyYAML>=6,<7",
  "numpy>=1.24,<3"
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
dev = ["pytest>=8", "pytest-cov>=4"]

[project.scripts]
agintor = "agintor.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agintor*"]

[tool.setuptools.package-data]
agintor = ["templates/baseline_runtime/*", "examples/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --basetemp=tests/_artifacts/pytest/tmp"
testpaths = ["tests"]
norecursedirs = ["_artifacts"]
markers = [
  "live_openai: live OpenAI integration tests (not run offline)",
]
